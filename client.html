<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ультра+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen" style="display: flex; flex-direction: column; padding: 20px; height: 100vh; justify-content: center; align-items: center;">
    <div class="auth-logo">🚀</div>
    <h1>Ультра+</h1>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button onclick="switchTab('login')" style="background: none; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer;">Вход</button>
      <button onclick="switchTab('register')" style="background: none; color: #888; border: none; font-size: 18px; font-weight: bold; cursor: pointer;">Регистрация</button>
    </div>

    <div id="form-login" style="display: flex; flex-direction: column; width: 100%; max-width: 300px; gap: 10px;">
      <input id="login-name" placeholder="Логин или номер" style="padding: 15px; border-radius: 10px; border: none; background: #1a1a35; color: white;" />
      <input id="login-pass" type="password" placeholder="Пароль" style="padding: 15px; border-radius: 10px; border: none; background: #1a1a35; color: white;" />
      <button onclick="login()" style="padding: 15px; background: #3390ec; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Войти</button>
    </div>

    <div id="form-register" style="display: none; flex-direction: column; width: 100%; max-width: 300px; gap: 10px;">
      <input id="reg-username" placeholder="Логин" style="padding: 15px; border-radius: 10px; border: none; background: #1a1a35; color: white;" />
      <input id="reg-phone" placeholder="Номер" style="padding: 15px; border-radius: 10px; border: none; background: #1a1a35; color: white;" />
      <input id="reg-pass" type="password" placeholder="Пароль" style="padding: 15px; border-radius: 10px; border: none; background: #1a1a35; color: white;" />
      <button onclick="register()" style="padding: 15px; background: #3390ec; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Создать аккаунт</button>
    </div>

    <div id="status" style="margin-top: 20px; color: yellow; font-weight: bold;"></div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? 'flex' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'flex' : 'none';
      // Меняем цвет кнопок
      const btns = document.querySelectorAll('button');
      btns[0].style.color = tab === 'login' ? 'white' : '#888';
      btns[1].style.color = tab === 'register' ? 'white' : '#888';
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim().replace('@', '');
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-pass').value;
      const statusEl = document.getElementById('status');
      
      if(!username || !phone || !password) { statusEl.innerText = "Заполните все поля!"; return; }
      statusEl.innerText = "Отправка...";
      
      try {
        const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, phone, password }) });
        const data = await res.json();
        if(data.success) {
          statusEl.innerText = "УСПЕХ! Аккаунт создан. Теперь войдите.";
          switchTab('login');
        } else {
          statusEl.innerText = "ОШИБКА: " + data.error;
        }
      } catch (e) {
        statusEl.innerText = "ОШИБКА СЕТИ: " + e.message;
      }
    }

    async function login() {
      const loginVal = document.getElementById('login-name').value.trim().replace('@', '');
      const password = document.getElementById('login-pass').value;
      const statusEl = document.getElementById('status');
      
      if(!loginVal || !password) { statusEl.innerText = "Заполните все поля!"; return; }
      statusEl.innerText = "Вход...";
      
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ login: loginVal, password }) });
        const data = await res.json();
        if(data.success) {
          statusEl.innerText = "УСПЕХ! Вход выполнен.";
          localStorage.setItem('ultra_user', data.user.username);
          localStorage.setItem('ultra_phone', data.user.phone);
          alert("Вход выполнен! Теперь мы можем переходить к чатам.");
        } else {
          statusEl.innerText = "ОШИБКА: " + data.error;
        }
      } catch (e) {
        statusEl.innerText = "ОШИБКА СЕТИ: " + e.message;
      }
    }
  </script>
</body>
</html>
