<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ультра+</title>
  <style>
    body { background: #0a0a14; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    input { padding: 10px; margin: 5px; border-radius: 8px; border: none; width: 250px; background: #1a1a35; color: #fff; }
    button { padding: 10px 20px; margin: 5px; border-radius: 8px; border: none; background: #3390ec; color: #fff; font-weight: bold; cursor: pointer; width: 250px; }
    #msg { color: yellow; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Ультра+ (Тест)</h2>
  
  <input id="u" placeholder="Логин" />
  <input id="p" type="password" placeholder="Пароль" />
  <input id="ph" placeholder="Номер (только для регистрации)" />
  
  <button id="btn-reg">Зарегистрироваться</button>
  <button id="btn-log">Войти</button>
  
  <div id="msg"></div>

  <script>
    document.getElementById('btn-reg').onclick = async () => {
      const username = document.getElementById('u').value;
      const phone = document.getElementById('ph').value;
      const password = document.getElementById('p').value;
      if(!username || !phone || !password) return document.getElementById('msg').innerText = "Заполните все поля!";
      
      document.getElementById('msg').innerText = "Ждем...";
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username, phone, password })
        });
        const data = await res.json();
        document.getElementById('msg').innerText = data.success ? "УСПЕХ! Аккаунт создан." : "ОШИБКА: " + data.error;
      } catch(e) { document.getElementById('msg').innerText = "ОШИБКА СЕТИ"; }
    };

    document.getElementById('btn-log').onclick = async () => {
      const login = document.getElementById('u').value;
      const password = document.getElementById('p').value;
      if(!login || !password) return document.getElementById('msg').innerText = "Заполните поля!";
      
      document.getElementById('msg').innerText = "Ждем...";
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if(data.success) {
          document.getElementById('msg').innerText = "УСПЕХ! Вы вошли как @" + data.user.username;
          showMainScreen(data.user.username);
        } else {
          document.getElementById('msg').innerText = "ОШИБКА: " + data.error;
        }
      } catch(e) { document.getElementById('msg').innerText = "ОШИБКА СЕТИ"; }
    };
    <!-- ГЛАВНЫЙ ЭКРАН (СПИСОК ЧАТОВ) -->
<div id="main-screen" style="display: none; flex-direction: column; width: 100%; max-width: 400px; height: 100vh; background: #0a0a14; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 10;">
  <div style="padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
    <h2 style="margin: 0; font-size: 24px; background: linear-gradient(90deg, #6e44ff, #ff44cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Ультра+</h2>
    <button onclick="findUser()" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">🔍</button>
  </div>
  <div id="chat-list" style="flex: 1; overflow-y: auto; padding: 10px 15px;"></div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chat-screen" style="display: none; flex-direction: column; width: 100%; max-width: 400px; height: 100vh; background: #0a0a14; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 20;">
  <div style="padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #2a2a4a;">
    <button onclick="closeChat()" style="background: none; border: none; color: #6e44ff; font-size: 24px; margin-right: 15px; cursor: pointer;">←</button>
    <h2 id="chat-title" style="margin: 0; font-size: 18px;">@...</h2>
  </div>
  <div id="messages" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
  <div style="padding: 10px; display: flex; gap: 10px; border-top: 1px solid #2a2a4a;">
    <input id="msg-input" placeholder="Сообщение..." style="flex: 1; padding: 10px; border-radius: 20px; border: none; background: #1a1a35; color: #fff;" />
    <button onclick="sendMessage()" style="padding: 10px 15px; border-radius: 50%; border: none; background: #3390ec; color: white; cursor: pointer;">➤</button>
  </div>
</div>
    // --- ЛОГИКА ЧАТОВ ---
let currentUser = "";
let currentChatId = "";
let currentChatName = "";
let msgInterval;

// Эта функция вызывается после успешного входа
function showMainScreen(username) {
  currentUser = username;
  document.querySelector('#auth-screen').style.display = 'none';
  const main = document.querySelector('#main-screen');
  main.style.display = 'flex';
  loadChats();
}

async function loadChats() {
  const res = await fetch('/api/chats/' + currentUser);
  const chats = await res.json();
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  
  if(chats.length === 0) {
    list.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">Нет чатов. Нажмите 🔍 чтобы найти друга.</p>`;
    return;
  }

  chats.forEach(chat => {
    const div = document.createElement('div');
    div.style.cssText = "padding: 15px; border-bottom: 1px solid #2a2a4a; cursor: pointer; color: white;";
    div.innerText = '@' + chat.name;
    div.onclick = () => openChat(chat.id, chat.name);
    list.appendChild(div);
  });
}

async function findUser() {
  const choice = prompt("1 - по номеру, 2 - по @логину:");
  if(!choice) return;
  let query = prompt(choice === '1' ? "Номер друга:" : "Логин друга:");
  if(!query) return;
  
  const url = choice === '1' ? '/api/find-by-phone/' + encodeURIComponent(query) : '/api/user/' + encodeURIComponent(query);
  const res = await fetch(url);
  const data = await res.json();
  
  if(!data) return alert("Не найден.");
  if(data.username === currentUser) return alert("Это вы!");
  
  const chatId = [currentUser, data.username].sort().join('_');
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, chatId, name: data.username, isGroup: false }) });
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: data.username, chatId, name: currentUser, isGroup: false }) });
  
  alert("Чат создан!");
  loadChats();
}

function openChat(id, name) {
  currentChatId = id;
  currentChatName = name;
  document.getElementById('chat-title').innerText = '@' + name;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  loadMessages();
  if(msgInterval) clearInterval(msgInterval);
  msgInterval = setInterval(loadMessages, 1500);
}

function closeChat() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  clearInterval(msgInterval);
  loadChats();
}

async function loadMessages() {
  if(!currentChatId) return;
  const res = await fetch(`/api/messages/${currentChatId}?reader=${currentUser}`);
  const msgs = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';
  
  msgs.forEach(m => {
    const isMe = m.sender === currentUser;
    const div = document.createElement('div');
    div.style.cssText = `padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 15px; ${isMe ? 'background: #3390ec; align-self: flex-end; color: white;' : 'background: #1a1a35; align-self: flex-start; color: white;'}`;
    div.innerText = m.text;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text) return;
  
  input.value = '';
  await fetch('/api/message', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ chatId: currentChatId, from: currentUser, text, fileUrl: null, fileType: null }) });
  loadMessages();
}
  </script>
</body>
</html>
