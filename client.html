<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ультра+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #0a0a14; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    #auth-screen { display: flex; flex-direction: column; padding: 20px; height: 100vh; justify-content: center; align-items: center; background: #0a0a14; }
    .auth-logo { width: 100px; height: 100px; background: linear-gradient(135deg, #6e44ff, #00d4ff); border-radius: 30%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(110, 68, 255, 0.5); }
    #auth-screen h1 { margin-bottom: 20px; text-shadow: 0 0 20px rgba(110, 68, 255, 0.8); }
    .auth-tab-btn { background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; padding: 10px; }
    .auth-input { padding: 15px; border-radius: 10px; border: none; background: #1a1a35; color: white; width: 100%; max-width: 300px; margin-bottom: 10px; box-sizing: border-box; }
    .auth-submit { padding: 15px; background: #3390ec; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; margin-top: 10px; box-sizing: border-box; }
    #status-msg { margin-top: 20px; color: yellow; font-weight: bold; text-align: center; }
    #main-screen, #chat-screen, #profile-screen { display: none; height: 100vh; width: 100%; max-width: 400px; background: #0a0a14; flex-direction: column; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 10; }
    .header { background: #0a0a14; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 24px; font-weight: bold; background: linear-gradient(90deg, #6e44ff, #ff44cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
    .header button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; margin-left: 10px; }
    #chat-list { flex: 1; overflow-y: auto; padding: 10px 15px; padding-bottom: 80px; }
    .chat-item { display: flex; align-items: center; padding: 15px; border-radius: 20px; cursor: pointer; margin-bottom: 12px; background: #14142b; border: 1px solid #2a2a4a; position: relative; }
    .chat-avatar { width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(45deg, #6e44ff, #00d4ff); display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 22px; font-weight: bold; overflow: hidden; flex-shrink: 0; padding: 2px; }
    .chat-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #14142b; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
    .chat-preview { font-size: 14px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-meta { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; height: 45px; margin-left: 10px; }
    .chat-time { font-size: 12px; color: #6e44ff; }
    .unread-badge { background: #00ff88; color: #000; font-size: 12px; font-weight: bold; min-width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .fab { position: absolute; bottom: 80px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(45deg, #6e44ff, #00d4ff); border: none; color: #fff; font-size: 30px; cursor: pointer; box-shadow: 0 5px 20px rgba(110, 68, 255, 0.5); z-index: 20; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: #14142b; border-top: 1px solid #2a2a4a; display: flex; justify-content: space-around; padding: 15px 0 10px; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; cursor: pointer; }
    .nav-item.active { color: #00d4ff; }
    .nav-icon { font-size: 22px; margin-bottom: 5px; }
    .nav-item span { font-size: 11px; }
    .chat-header { background: #14142b; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #2a2a4a; }
    .back-btn { background: none; border: none; color: #6e44ff; font-size: 24px; margin-right: 15px; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg-container { display: flex; flex-direction: column; position: relative; max-width: 85%; }
    .msg-container.my { align-self: flex-end; align-items: flex-end; }
    .msg-container.their { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 10px 15px; border-radius: 20px; font-size: 15px; word-wrap: break-word; line-height: 1.4; }
    .msg-my { background: linear-gradient(135deg, #6e44ff, #4a2b9e); border-bottom-right-radius: 5px; }
    .msg-their { background: #1a1a35; border-bottom-left-radius: 5px; }
    .input-area { padding: 10px 15px; background: #14142b; display: flex; gap: 10px; align-items: center; border-top: 1px solid #2a2a4a; }
    .input-area input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; background: #0a0a14; color: #fff; outline: none; }
    .input-area button { background: #6e44ff; border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn { background: none !important; color: #3390ec !important; font-size: 22px !important; box-shadow: none !important; }
    .profile-top { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; background: #17212b; position: relative; }
    .profile-top .back-btn { position: absolute; top: 20px; left: 20px; }
    .profile-avatar-big { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; margin-bottom: 15px; cursor: pointer; background: #242f3d; }
    .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
    .profile-bio { font-size: 14px; color: #ccc; text-align: center; font-style: italic; margin-bottom: 10px; }
    .profile-phone { font-size: 15px; color: #7d8b99; }
    .profile-settings { padding: 20px; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #242f3d; cursor: pointer; font-size: 16px; }

    /* Стили для экрана звонка */
    #call-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a14; z-index: 999; flex-direction: column; justify-content: center; align-items: center; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-logo">🚀</div>
  <h1>Ультра+</h1>
  <div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <button class="auth-tab-btn" id="tab-login" style="color: white;">Вход</button>
    <button class="auth-tab-btn" id="tab-register" style="color: #888;">Регистрация</button>
  </div>
  <div id="form-login" style="display: flex; flex-direction: column; width: 100%; max-width: 300px; gap: 10px;">
    <input id="login-name" class="auth-input" placeholder="Логин или номер" autocomplete="off" />
    <input id="login-pass" class="auth-input" type="password" placeholder="Пароль" />
    <button class="auth-submit" id="btn-login">Войти</button>
  </div>
  <div id="form-register" style="display: none; flex-direction: column; width: 100%; max-width: 300px; gap: 10px;">
    <input id="reg-username" class="auth-input" placeholder="Логин" autocomplete="off" />
    <input id="reg-phone" class="auth-input" placeholder="Номер телефона" type="tel" />
    <input id="reg-pass" class="auth-input" type="password" placeholder="Пароль" />
    <button class="auth-submit" id="btn-register">Создать аккаунт</button>
  </div>
  <div id="status-msg"></div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="main-screen">
  <div class="header">
    <h2>Ультра+</h2>
    <div>
      <button id="btn-find">🔍</button>
      <button id="btn-profile">⚙️</button>
    </div>
  </div>
  <div id="chat-list"></div>
  <button class="fab" id="btn-fab">+</button>
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">💬</span><span>Чаты</span></div>
    <div class="nav-item"><span class="nav-icon">📞</span><span>Звонки</span></div>
    <div class="nav-item"><span class="nav-icon">👥</span><span>Контакты</span></div>
    <div class="nav-item" id="nav-profile"><span class="nav-icon">👤</span><span>Профиль</span></div>
  </div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" id="btn-back">←</button>
    <div class="chat-avatar" id="chat-head-avatar" style="width: 40px; height: 40px; margin-right: 10px;"></div>
    <div>
      <h2 id="chat-title" style="font-size:16px;">Чат</h2>
      <span id="chat-status" style="font-size:12px;">в сети</span>
    </div>
    <!-- КНОПКА ЗВОНКА -->
    <button id="btn-call" style="margin-left: auto; background: none; border: none; color: #00ff88; font-size: 24px; cursor: pointer;">📞</button>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input type="file" id="file-input" style="display: none;">
    <button class="icon-btn" id="btn-attach">📎</button>
    <button class="icon-btn" id="btn-mic">🎤</button>
    <input id="msg-input" placeholder="Написать сообщение...">
    <button id="btn-send">➤</button>
  </div>
</div>

<!-- ЭКРАН ПРОФИЛЯ -->
<div id="profile-screen">
  <div class="profile-top">
    <button class="back-btn" id="btn-back-profile">←</button>
    <div class="profile-avatar-big" id="btn-avatar-upload">
      <img id="prof-avatar-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    </div>
    <input type="file" id="avatar-upload" style="display: none;" accept="image/*">
    <h2 id="prof-name" class="profile-name">@...</h2>
    <div id="prof-bio" class="profile-bio">Напишите что-нибудь о себе...</div>
    <div id="prof-phone" class="profile-phone">+...</div>
  </div>
  <div class="profile-settings">
    <div class="setting-item" id="btn-edit-bio"><span>📝 Изменить статус</span></div>
    <div class="setting-item" id="btn-change-photo"><span>📷 Выбрать фото</span></div>
    <div class="setting-item" id="btn-hide-phone"><span>🔒 Скрыть номер</span><span id="hide-phone-status" style="color: #3390ec;">Выкл</span></div>
    <div class="setting-item" id="btn-logout"><span style="color: #ff4444;">🚪 Выйти</span></div>
  </div>
</div>

<!-- ЭКРАН ЗВОНКА -->
<div id="call-screen">
  <div style="font-size: 80px; margin-bottom: 20px; animation: pulse 1.5s infinite;">📞</div>
  <h2 id="call-name" style="font-size: 24px; margin-bottom: 10px;">@...</h2>
  <p id="call-status" style="color: #888; margin-bottom: 40px;">Вызов...</p>
  
  <div style="display: flex; gap: 30px;">
    <button id="btn-decline" style="background: #ff4444; border: none; width: 70px; height: 70px; border-radius: 50%; color: white; font-size: 30px; cursor: pointer;">✖</button>
    <button id="btn-accept" style="background: #00ff88; border: none; width: 70px; height: 70px; border-radius: 50%; color: black; font-size: 30px; cursor: pointer;">✔</button>
    <button id="btn-mute" style="display: none; background: #555; border: none; width: 70px; height: 70px; border-radius: 50%; color: white; font-size: 30px; cursor: pointer;">🎤</button>
  </div>

  <!-- Скрытый аудио-элемент для WebRTC -->
  <audio id="remote-audio" autoplay></audio>
</div>

<script src="app.js"></script>
</body>
</html>
