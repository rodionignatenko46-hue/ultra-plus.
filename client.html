<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ультра+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    #chat-screen, #main-screen, #auth-screen { height: 100dvh; }
    
    .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #2a2a4a; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #888; font-weight: bold; }
    .auth-tab.active { color: #00d4ff; border-bottom: 2px solid #00d4ff; }
    .auth-form { display: none; flex-direction: column; }
    .auth-form.active { display: flex; }
  </style>
</head>
<body>

<!-- Экран входа/регистрации -->
<div id="auth-screen">
  <div class="auth-logo">🚀</div>
  <h1>Ультра+</h1>
  
  <div class="auth-tabs">
    <div class="auth-tab active" onclick="switchTab('login')">Вход</div>
    <div class="auth-tab" onclick="switchTab('register')">Регистрация</div>
  </div>

  <!-- Форма входа -->
  <div id="form-login" class="auth-form active">
    <div class="input-group">
      <label>Логин или номер телефона</label>
      <input id="login-name" placeholder="@lorion4ik или +7999..." autocomplete="off" />
    </div>
    <div class="input-group">
      <label>Пароль</label>
      <input id="login-pass" type="password" placeholder="Ваш пароль" />
    </div>
    <button onclick="login()">Войти</button>
  </div>

  <!-- Форма регистрации -->
  <div id="form-register" class="auth-form">
    <div class="input-group">
      <label>Придумайте @логин</label>
      <input id="reg-username" placeholder="lorion4ik" autocomplete="off" />
    </div>
    <div class="input-group">
      <label>Номер телефона</label>
      <input id="reg-phone" placeholder="+7 (999) 000-00-00" type="tel" />
    </div>
    <div class="input-group">
      <label>Придумайте пароль</label>
      <input id="reg-pass" type="password" placeholder="Минимум 4 символа" />
    </div>
    <button onclick="register()">Создать аккаунт</button>
  </div>
</div>

<!-- Главный экран -->
<div id="main-screen">
  <div class="header">
    <h2>Ультра+</h2>
    <div class="header-icons">
      <button onclick="findUser()">🔍</button>
      <button onclick="showProfile()">⚙️</button>
    </div>
  </div>
  <div id="chat-list"></div>
  <button class="fab" onclick="findUser()">+</button>
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">💬</span><span>Чаты</span></div>
    <div class="nav-item"><span class="nav-icon">📞</span><span>Звонки</span></div>
    <div class="nav-item"><span class="nav-icon">👥</span><span>Контакты</span></div>
    <div class="nav-item" onclick="showProfile()"><span class="nav-icon">👤</span><span>Профиль</span></div>
  </div>
</div>

<!-- Экран чата -->
<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-avatar" id="chat-head-avatar"></div>
    <div>
      <h2 id="chat-title" style="font-size:16px;">Чат</h2>
      <span id="chat-status" style="font-size:12px;">в сети</span>
    </div>
  </div>
  <div id="messages"></div>
  <div id="reply-preview" style="display:none; background:#2c2c2c; padding:10px; border-left:3px solid #00d4ff; margin: 0 10px; border-radius:5px; font-size:12px; color:#ccc; position: relative;">
    <span id="reply-text"></span>
    <button onclick="cancelReply()" style="position:absolute; right:10px; top:10px; background:none; border:none; color:red;">✖</button>
  </div>
  <div class="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(this)">
    <button onclick="document.getElementById('file-input').click()" style="background: none; color: #3390ec; box-shadow: none; font-size: 22px;">📎</button>
    <button onclick="toggleRecording()" id="mic-btn" style="background: none; color: #3390ec; box-shadow: none; font-size: 22px;">🎤</button>
    <input id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()" oninput="sendPulse(true)">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- Экран профиля -->
<div id="profile-screen">
  <div class="profile-top">
    <button class="back-btn" onclick="closeProfile()" style="color: #fff; font-size: 24px;">←</button>
    <div class="profile-avatar-big" onclick="document.getElementById('avatar-upload').click()">
      <img id="prof-avatar-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
      <div class="avatar-edit-icon">📷</div>
    </div>
    <input type="file" id="avatar-upload" style="display: none;" accept="image/*" onchange="uploadAvatar(event)">
    <h2 id="prof-name" class="profile-name">@...</h2>
    <div id="prof-bio" class="profile-bio">Напишите что-нибудь о себе...</div>
    <div id="prof-phone" class="profile-phone">+...</div>
  </div>
  <div class="profile-settings">
    <div class="setting-item" onclick="editBio()"><span>📝 Изменить статус</span></div>
    <div class="setting-item" onclick="document.getElementById('avatar-upload').click()"><span>📷 Выбрать фото</span></div>
    <div class="setting-item" onclick="toggleHidePhone()"><span>🔒 Скрыть номер</span><span id="hide-phone-status" style="color: #3390ec;">Выкл</span></div>
    <div class="setting-item" onclick="logout()"><span style="color: #ff4444;">🚪 Выйти</span></div>
  </div>
</div>

<script>
let currentUser = "", currentPhone = "", currentAvatar = "", currentHidePhone = false;
let currentChatId = "", currentChatName = "", messageInterval, statusInterval;
let selectedFile = null, selectedFileType = null;
let replyToMessage = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let recordingTimer, recordingSeconds = 0;

// Переключение вкладок Вход/Регистрация
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  if(tab === 'login') {
    document.querySelector('.auth-tab:nth-child(1)').classList.add('active');
    document.getElementById('form-login').classList.add('active');
  } else {
    document.querySelector('.auth-tab:nth-child(2)').classList.add('active');
    document.getElementById('form-register').classList.add('active');
  }
}

window.onload = () => {
  const savedUser = localStorage.getItem('ultra_user');
  if(savedUser) {
    currentUser = savedUser;
    currentPhone = localStorage.getItem('ultra_phone') || '';
    currentAvatar = localStorage.getItem('ultra_avatar') || '';
    currentHidePhone = localStorage.getItem('ultra_hide') === 'true';
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    loadChats();
    setInterval(() => sendPulse(false), 10000);
  }
};

// РЕГИСТРАЦИЯ
async function register() {
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-pass').value;
  if(!username || !phone || !password) return alert("Заполните все поля!");
  
  const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, phone, password }) });
  const data = await res.json();
  if(data.success) {
    currentUser = username; currentPhone = phone;
    localStorage.setItem('ultra_user', currentUser);
    localStorage.setItem('ultra_phone', currentPhone);
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    loadChats();
    setInterval(() => sendPulse(false), 10000);
  } else {
    alert("Ошибка: " + data.error);
  }
}

// ВХОД
async function login() {
  const loginVal = document.getElementById('login-name').value.trim().replace('@', '');
  const password = document.getElementById('login-pass').value;
  if(!loginVal || !password) return alert("Заполните все поля!");

  const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ login: loginVal, password }) });
  const data = await res.json();
  
  if(data.success) {
    currentUser = data.user.username; 
    currentPhone = data.user.phone;
    currentAvatar = data.user.avatar;
    localStorage.setItem('ultra_user', currentUser);
    localStorage.setItem('ultra_phone', currentPhone);
    localStorage.setItem('ultra_avatar', currentAvatar || '');
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    loadChats();
    setInterval(() => sendPulse(false), 10000);
  } else {
    alert("Ошибка: " + data.error);
  }
}

function logout() { if(confirm("Выйти?")) { localStorage.clear(); location.reload(); } }
function sendPulse(typing) { if(currentUser) fetch('/api/pulse', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, typing }) }); }

// Остальные функции без изменений (профиль, чаты, сообщения)
// ... (вставь сюда остальные функции из предыдущего рабочего client.html)
</script>
</body>
</html>
