<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ультра+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    #chat-screen, #main-screen, #auth-screen { height: 100dvh; }
  </style>
</head>
<body>

<!-- Экран входа -->
<div id="auth-screen">
  <div class="auth-logo">🚀</div>
  <h1>Ультра+</h1>
  <p class="auth-subtitle">Твой космический мессенджер</p>
  <div class="input-group">
    <label>Придумайте ваш @логин</label>
    <input id="reg-username" placeholder="Например: lorion4ik" autocomplete="off" />
  </div>
  <div class="input-group">
    <label>Номер телефона</label>
    <input id="reg-phone" placeholder="+7 (999) 000-00-00" type="tel" />
  </div>
  <button onclick="register()">Создать аккаунт</button>
  <p class="auth-footer">Нажимая «Войти», вы соглашаетесь с правилами Ультра+</p>
</div>

<!-- Главный экран -->
<div id="main-screen">
  <div class="header">
    <h2>Ультра+</h2>
    <div class="header-icons">
      <button onclick="findUser()">🔍</button>
      <button onclick="showProfile()">⚙️</button>
    </div>
  </div>
  <div id="chat-list"></div>
  <button class="fab" onclick="findUser()">+</button>
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">💬</span><span>Чаты</span></div>
    <div class="nav-item"><span class="nav-icon">📞</span><span>Звонки</span></div>
    <div class="nav-item"><span class="nav-icon">👥</span><span>Контакты</span></div>
    <div class="nav-item" onclick="showProfile()"><span class="nav-icon">👤</span><span>Профиль</span></div>
  </div>
</div>

<!-- Экран чата -->
<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-avatar" id="chat-head-avatar"></div>
    <div>
      <h2 id="chat-title" style="font-size:16px;">Чат</h2>
      <span id="chat-status" style="font-size:12px;">в сети</span>
    </div>
  </div>
  <div id="messages"></div>
  <div id="reply-preview" style="display:none; background:#2c2c2c; padding:10px; border-left:3px solid #00d4ff; margin: 0 10px; border-radius:5px; font-size:12px; color:#ccc; position: relative;">
    <span id="reply-text"></span>
    <button onclick="cancelReply()" style="position:absolute; right:10px; top:10px; background:none; border:none; color:red;">✖</button>
  </div>
  <div class="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(this)">
    <button onclick="document.getElementById('file-input').click()" style="background: none; color: #3390ec; box-shadow: none; font-size: 22px;">📎</button>
    <button onclick="toggleRecording()" id="mic-btn" style="background: none; color: #3390ec; box-shadow: none; font-size: 22px;">🎤</button>
    <input id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()" oninput="sendPulse(true)">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- Экран профиля -->
<div id="profile-screen">
  <div class="profile-top">
    <button class="back-btn" onclick="closeProfile()" style="color: #fff; font-size: 24px;">←</button>
    <div class="profile-avatar-big" onclick="document.getElementById('avatar-upload').click()">
      <img id="prof-avatar-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
      <div class="avatar-edit-icon">📷</div>
    </div>
    <input type="file" id="avatar-upload" style="display: none;" accept="image/*" onchange="uploadAvatar(event)">
    <h2 id="prof-name" class="profile-name">@...</h2>
    <div id="prof-bio" class="profile-bio">Напишите что-нибудь о себе...</div>
    <div id="prof-phone" class="profile-phone">+...</div>
  </div>
  <div class="profile-settings">
    <div class="setting-item" onclick="editBio()"><span>📝 Изменить статус</span></div>
    <div class="setting-item" onclick="document.getElementById('avatar-upload').click()"><span>📷 Выбрать фото</span></div>
    <div class="setting-item" onclick="toggleHidePhone()"><span>🔒 Скрыть номер</span><span id="hide-phone-status" style="color: #3390ec;">Выкл</span></div>
    <div class="setting-item" onclick="logout()"><span style="color: #ff4444;">🚪 Выйти</span></div>
  </div>
</div>

<script>
let currentUser = "", currentPhone = "", currentAvatar = "", currentHidePhone = false;
let currentChatId = "", currentChatName = "", messageInterval, statusInterval;
let selectedFile = null, selectedFileType = null;
let replyToMessage = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let recordingTimer, recordingSeconds = 0;

// --- УВЕДОМЛЕНИЯ ---
let lastNotifiedMsgId = null;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNotificationSound() {
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
  gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

function showNotification(title, body) {
  playNotificationSound();
  if (Notification.permission === "granted") {
    new Notification(title, { body: body, icon: "https://cdn-icons-png.flaticon.com/512/3212/3212608.png" });
  }
}

// Фоновая проверка ВСЕХ чатов на новые сообщения
async function checkAllChatsForNotifications() {
  if (!currentUser || document.visibilityState !== 'visible') return;
  
  try {
    const res = await fetch('/api/chats/' + currentUser);
    const chats = await res.json();
    
    for (let chat of chats) {
      // Не уведомляем о том чате, который сейчас открыт
      if (chat.id === currentChatId) continue; 

      const msgRes = await fetch(`/api/messages/${chat.id}?reader=${currentUser}`);
      const msgs = await msgRes.json();
      
      if (msgs.length > 0) {
        const lastMsg = msgs[msgs.length - 1];
        // Если сообщение от другого человека и мы о нем еще не уведомляли
        if (lastMsg.sender !== currentUser && lastMsg.id !== lastNotifiedMsgId) {
          lastNotifiedMsgId = lastMsg.id;
          showNotification("Новое сообщение в Ультра+", `@${lastMsg.sender}: ${lastMsg.text || 'Файл'}`);
        }
      }
    }
  } catch(e) {}
}

window.onload = () => {
  // Запрашиваем разрешение на уведомления
  if ("Notification" in window) {
    Notification.requestPermission();
  }

  const savedUser = localStorage.getItem('ultra_user');
  if(savedUser) {
    currentUser = savedUser;
    currentPhone = localStorage.getItem('ultra_phone') || '';
    currentAvatar = localStorage.getItem('ultra_avatar') || '';
    currentHidePhone = localStorage.getItem('ultra_hide') === 'true';
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    loadChats();
    setInterval(() => sendPulse(false), 10000);
    
    // Запускаем фоновую проверку уведомлений каждые 3 секунды
    setInterval(checkAllChatsForNotifications, 3000);
  }
};

async function register() {
  if ("Notification" in window) Notification.requestPermission();
  
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const phone = document.getElementById('reg-phone').value.trim();
  if(!username || !phone) return alert("Введите логин и номер!");
  currentUser = username; currentPhone = phone;
  localStorage.setItem('ultra_user', currentUser);
  localStorage.setItem('ultra_phone', currentPhone);
  const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, phone }) });
  const data = await res.json();
  if(data.success) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    loadChats();
    setInterval(() => sendPulse(false), 10000);
    setInterval(checkAllChatsForNotifications, 3000);
  } else { alert("Ошибка: " + data.error); }
}

function logout() { if(confirm("Выйти?")) { localStorage.clear(); location.reload(); } }
function sendPulse(typing) { if(currentUser) fetch('/api/pulse', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, typing }) }); }

async function showProfile() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('profile-screen').style.display = 'flex';
  document.getElementById('prof-name').innerText = '@' + currentUser;
  document.getElementById('prof-phone').innerText = currentHidePhone ? 'Номер скрыт' : currentPhone;
  document.getElementById('hide-phone-status').innerText = currentHidePhone ? 'Вкл' : 'Выкл';
  if(currentAvatar) document.getElementById('prof-avatar-img').src = currentAvatar;
  const res = await fetch('/api/user/' + currentUser);
  const data = await res.json();
  document.getElementById('prof-bio').innerText = (data && data.bio) ? data.bio : 'Напишите что-нибудь о себе...';
}

async function editBio() {
  const newBio = prompt("Ваш новый статус:");
  if(newBio === null) return;
  await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, bio: newBio }) });
  document.getElementById('prof-bio').innerText = newBio || 'Напишите что-нибудь о себе...';
}

function closeProfile() { document.getElementById('profile-screen').style.display = 'none'; document.getElementById('main-screen').style.display = 'flex'; }

function toggleHidePhone() {
  currentHidePhone = !currentHidePhone;
  localStorage.setItem('ultra_hide', currentHidePhone);
  document.getElementById('hide-phone-status').innerText = currentHidePhone ? 'Вкл' : 'Выкл';
  document.getElementById('prof-phone').innerText = currentHidePhone ? 'Номер скрыт' : currentPhone;
  fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, hidePhone: currentHidePhone }) });
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result;
    const res = await fetch('/api/upload', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ fileName: 'avatar.jpg', fileData: base64, fileType: file.type }) });
    const data = await res.json();
    if(data.success) {
      currentAvatar = data.url;
      localStorage.setItem('ultra_avatar', currentAvatar);
      document.getElementById('prof-avatar-img').src = currentAvatar;
      await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, avatar: currentAvatar }) });
    }
  };
  reader.readAsDataURL(file);
}

async function loadChats() {
  const res = await fetch('/api/chats/' + currentUser);
  const chats = await res.json();
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  if(chats.length === 0) list.innerHTML = `<div style="text-align:center; margin-top: 40px;"><h3 style="color: #fff;">Здесь пока пусто</h3><button onclick="findUser()" style="background: #3390ec; color: white; border: none; padding: 12px 24px; border-radius: 12px; margin-top: 15px;">Найти друга</button></div>`;
  chats.forEach(chat => {
    const div = document.createElement('div'); div.className = 'chat-item'; div.onclick = () => openChat(chat.id, chat.name, chat.isGroup);
    div.innerHTML = `<div class="chat-avatar"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></div><div class="chat-info"><div class="chat-name">@${chat.name}</div><div class="chat-preview">Открыть</div></div>`;
    list.appendChild(div);
  });
}

async function findUser() {
  const choice = prompt("1 - по номеру, 2 - по @логину:");
  if(!choice) return;
  let query = prompt(choice === '1' ? "Номер друга:" : "Логин друга:");
  if(!query) return;
  const url = choice === '1' ? '/api/find-by-phone/' + encodeURIComponent(query) : '/api/user/' + encodeURIComponent(query);
  const res = await fetch(url);
  const data = await res.json();
  if(!data) return alert("Не найден.");
  if(data.username === currentUser) return alert("Это вы!");
  const chatId = [currentUser, data.username].sort().join('_');
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, chatId, name: data.username, isGroup: false }) });
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: data.username, chatId, name: currentUser, isGroup: false }) });
  alert("Чат создан!"); loadChats();
}

function openChat(id, name, isGroup) {
  currentChatId = id; currentChatName = name;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('chat-title').innerText = '@' + name;
  loadMessages();
  if(messageInterval) clearInterval(messageInterval);
  messageInterval = setInterval(loadMessages, 1000);
  if(statusInterval) clearInterval(statusInterval);
  statusInterval = setInterval(checkStatus, 2000);
}

function closeChat() { document.getElementById('chat-screen').style.display = 'none'; document.getElementById('main-screen').style.display = 'flex'; clearInterval(messageInterval); clearInterval(statusInterval); loadChats(); }

async function checkStatus() {
  if(!currentChatName) return;
  const res = await fetch('/api/status/' + currentChatName);
  const data = await res.json();
  const statusEl = document.getElementById('chat-status');
  if(data.isTyping) { statusEl.innerText = 'печатает...'; statusEl.className = 'typing'; }
  else if(data.isOnline) { statusEl.innerText = 'в сети'; statusEl.className = ''; statusEl.style.color = '#00ff88'; }
  else { statusEl.innerText = 'был(а) недавно'; statusEl.className = ''; statusEl.style.color = '#888'; }
}

function handleFileSelect(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) { selectedFile = e.target.result; selectedFileType = file.type; document.getElementById('msg-input').placeholder = "Файл готов!"; };
  reader.readAsDataURL(file);
}

async function toggleRecording() {
  const micBtn = document.getElementById('mic-btn');
  const inputField = document.getElementById('msg-input');
  if(!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const options = { mimeType: 'audio/webm' }; 
      mediaRecorder = new MediaRecorder(stream, options);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = async function(e) {
          inputField.placeholder = "Отправка голосового...";
          const res = await fetch('/api/upload', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ fileName: 'voice.webm', fileData: e.target.result, fileType: 'audio/webm' }) });
          const data = await res.json();
          if(data.success) {
            await fetch('/api/message', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ chatId: currentChatId, from: currentUser, text: '', fileUrl: data.url, fileType: 'audio/webm', replyTo: null }) });
            loadMessages();
            inputField.placeholder = "Написать сообщение...";
          } else {
            alert("Ошибка загрузки: " + data.error);
            inputField.placeholder = "Написать сообщение...";
          }
        };
        reader.readAsDataURL(audioBlob);
      };
      mediaRecorder.start(); isRecording = true; recordingSeconds = 0;
      micBtn.classList.add('recording'); micBtn.innerText = '⏹️';
      inputField.placeholder = "Идет запись... 0:00"; inputField.disabled = true;
      recordingTimer = setInterval(() => {
        recordingSeconds++;
        const mins = Math.floor(recordingSeconds / 60);
        const secs = recordingSeconds % 60;
        inputField.placeholder = `Идет запись... ${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }, 1000);
    } catch(e) { alert("Нет доступа к микрофону."); }
  } else {
    mediaRecorder.stop(); isRecording = false; clearInterval(recordingTimer);
    micBtn.classList.remove('recording'); micBtn.innerText = '🎤';
    inputField.disabled = false; inputField.placeholder = "Написать сообщение...";
  }
}

async function loadMessages() {
  if(!currentChatId) return;
  try {
    const res = await fetch(`/api/messages/${currentChatId}?reader=${currentUser}`);
    const msgs = await res.json();
    const box = document.getElementById('messages');
    if(box.children.length === msgs.length && box.dataset.lastMsg === (msgs[msgs.length-1]?.id || '')) return;
    box.innerHTML = ''; box.dataset.lastMsg = msgs[msgs.length-1]?.id || '';
    msgs.forEach(m => {
      const isMe = m.sender === currentUser;
      const div = document.createElement('div'); div.className = `msg-container ${isMe ? 'my' : 'their'}`;
      const time = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      let readStatus = isMe ? (m.read_by.length > 1 ? ' ✓✓' : ' ✓') : '';
      let content = '';
      if(m.reply_to) {
        const originalMsg = msgs.find(x => x.id === m.reply_to);
        if(originalMsg) content += `<div class="reply-quote">${originalMsg.text || 'Файл'}</div>`;
      }
      if(m.file_url) {
        if(m.file_type.startsWith('image/')) content += `<img src="${m.file_url}" style="max-width:100%; border-radius:10px; margin-bottom:5px;"><br>`;
        else if(m.file_type.startsWith('video/')) content += `<video src="${m.file_url}" controls style="max-width:100%; border-radius:10px; margin-bottom:5px;"></video><br>`;
        else if(m.file_type.startsWith('audio/')) content += `<audio src="${m.file_url}" controls style="max-width:100%; margin-bottom:5px;"></audio><br>`;
        else content += `<a href="${m.file_url}" target="_blank" style="color:#fff;">📄 Скачать файл</a><br>`;
      }
      content += m.text;
      let html = `<div class="msg-bubble ${isMe ? 'msg-my' : 'msg-their'}" style="cursor:pointer;" onclick="setReply('${m.id}', '${(m.text || 'Файл').replace(/'/g, "\\'")}')">${content}<div style="font-size:10px; text-align:right; opacity:0.7; margin-top:5px;">${time}${readStatus}</div></div>`;
      if(isMe) html += `<button class="msg-delete-btn" onclick="deleteMsg('${m.id}')">Удалить</button>`;
      div.innerHTML = html; box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch(e) {}
}

function setReply(id, text) { replyToMessage = { id, text }; document.getElementById('reply-text').innerText = text; document.getElementById('reply-preview').style.display = 'block'; document.getElementById('msg-input').focus(); }
function cancelReply() { replyToMessage = null; document.getElementById('reply-preview').style.display = 'none'; }
async function deleteMsg(id) { if(confirm("Удалить?")) { await fetch(`/api/message/${currentChatId}/${id}`, { method: 'DELETE' }); loadMessages(); } }

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text && !selectedFile) return;
  let fileUrl = null, fileTypeToSend = null;
  if(selectedFile) {
    input.p
