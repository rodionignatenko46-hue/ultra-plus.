<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ультра+</title>
  <style>
    body { background: #0a0a14; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .logo { width: 100px; height: 100px; background: linear-gradient(135deg, #6e44ff, #00d4ff); border-radius: 30%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; }
    input { padding: 15px; margin: 5px; border-radius: 10px; border: none; width: 250px; background: #1a1a35; color: #fff; box-sizing: border-box; }
    button { padding: 15px; margin: 5px; border-radius: 10px; border: none; background: #3390ec; color: #fff; font-weight: bold; cursor: pointer; width: 250px; }
    #msg { color: yellow; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="logo">🚀</div>
  <h2>Ультра+</h2>
  
  <input id="u" placeholder="Логин" />
  <input id="p" type="password" placeholder="Пароль" />
  <input id="ph" placeholder="Номер (только для регистрации)" />
  
  <button id="btn-reg">Зарегистрироваться</button>
  <button id="btn-log">Войти</button>
  
  <div id="msg"></div>
  <script>
  // Ждем, пока страница загрузится
  document.addEventListener('DOMContentLoaded', () => {
    
    // Кнопка РЕГИСТРАЦИИ
    document.getElementById('btn-reg').addEventListener('click', async () => {
      const username = document.getElementById('u').value;
      const phone = document.getElementById('ph').value;
      const password = document.getElementById('p').value;
      const msg = document.getElementById('msg');
      
      if(!username || !phone || !password) { msg.innerText = "Заполните все поля!"; return; }
      msg.innerText = "Отправка...";
      
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username, phone, password })
        });
        const data = await res.json();
        msg.innerText = data.success ? "УСПЕХ! Аккаунт создан." : "ОШИБКА: " + data.error;
      } catch(e) { msg.innerText = "ОШИБКА СЕТИ: " + e.message; }
    });

    // Кнопка ВХОДА
    document.getElementById('btn-log').addEventListener('click', async () => {
      const login = document.getElementById('u').value;
      const password = document.getElementById('p').value;
      const msg = document.getElementById('msg');
      
      if(!login || !password) { msg.innerText = "Заполните поля!"; return; }
      msg.innerText = "Вход...";
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        
        if(data.success) {
          msg.innerText = "УСПЕХ! Вы вошли как @" + data.user.username;
          localStorage.setItem('ultra_user', data.user.username);
        } else {
          msg.innerText = "ОШИБКА: " + data.error;
        }
      } catch(e) { msg.innerText = "ОШИБКА СЕТИ: " + e.message; }
    });

  });
  </script>
</body>
</html>
