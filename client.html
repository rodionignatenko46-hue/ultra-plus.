<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ультра+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #0a0a14; color: #fff; font-family: 'Segoe UI', sans-serif; }
    
    /* СТИЛЬ ВХОДА (как тебе понравилось) */
    #auth-screen { display: flex; flex-direction: column; padding: 20px; height: 100vh; justify-content: center; align-items: center; background: #0a0a14; }
    .auth-logo { width: 100px; height: 100px; background: linear-gradient(135deg, #6e44ff, #00d4ff); border-radius: 30%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(110, 68, 255, 0.5); }
    #auth-screen h1 { margin-bottom: 20px; text-shadow: 0 0 20px rgba(110, 68, 255, 0.8); }
    .auth-tab-btn { background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; padding: 10px; }
    .auth-input { padding: 15px; border-radius: 10px; border: none; background: #1a1a35; color: white; width: 100%; max-width: 300px; margin-bottom: 10px; }
    .auth-submit { padding: 15px; background: #3390ec; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; margin-top: 10px; }
    #status-msg { margin-top: 20px; color: yellow; font-weight: bold; text-align: center; }

    /* СКРЫТЫЕ ЭКРАНЫ */
    #main-screen, #chat-screen, #profile-screen { display: none; height: 100vh; width: 100%; max-width: 400px; background: #0a0a14; flex-direction: column; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 10; }
    
    /* Главный экран */
    .header { background: #0a0a14; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 24px; font-weight: bold; background: linear-gradient(90deg, #6e44ff, #ff44cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; margin-left: 10px; }
    
    #chat-list { flex: 1; overflow-y: auto; padding: 10px 15px; padding-bottom: 80px; }
    .chat-item { display: flex; align-items: center; padding: 15px; border-radius: 20px; cursor: pointer; margin-bottom: 12px; background: #14142b; border: 1px solid #2a2a4a; position: relative; }
    .chat-avatar { width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(45deg, #6e44ff, #00d4ff); display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 22px; font-weight: bold; overflow: hidden; flex-shrink: 0; padding: 2px; }
    .chat-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #14142b; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
    .chat-preview { font-size: 14px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-meta { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; height: 45px; margin-left: 10px; }
    .chat-time { font-size: 12px; color: #6e44ff; }
    .unread-badge { background: #00ff88; color: #000; font-size: 12px; font-weight: bold; min-width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .fab { position: absolute; bottom: 80px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(45deg, #6e44ff, #00d4ff); border: none; color: #fff; font-size: 30px; cursor: pointer; box-shadow: 0 5px 20px rgba(110, 68, 255, 0.5); z-index: 20; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: #14142b; border-top: 1px solid #2a2a4a; display: flex; justify-content: space-around; padding: 15px 0 10px; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; cursor: pointer; }
    .nav-item.active { color: #00d4ff; }
    .nav-icon { font-size: 22px; margin-bottom: 5px; }
    .nav-item span { font-size: 11px; }

    /* Экран чата */
    .chat-header { background: #14142b; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #2a2a4a; }
    .back-btn { background: none; border: none; color: #6e44ff; font-size: 24px; margin-right: 15px; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg-container { display: flex; flex-direction: column; position: relative; max-width: 85%; }
    .msg-container.my { align-self: flex-end; align-items: flex-end; }
    .msg-container.their { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 10px 15px; border-radius: 20px; font-size: 15px; word-wrap: break-word; line-height: 1.4; }
    .msg-my { background: linear-gradient(135deg, #6e44ff, #4a2b9e); border-bottom-right-radius: 5px; }
    .msg-their { background: #1a1a35; border-bottom-left-radius: 5px; }
    .input-area { padding: 10px 15px; background: #14142b; display: flex; gap: 10px; align-items: center; border-top: 1px solid #2a2a4a; }
    .input-area input[type="text"] { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; background: #0a0a14; color: #fff; outline: none; }
    .input-area button { background: #6e44ff; border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn { background: none !important; color: #3390ec !important; font-size: 22px !important; box-shadow: none !important; }

    /* Экран профиля */
    .profile-top { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; background: #17212b; position: relative; }
    .profile-top .back-btn { position: absolute; top: 20px; left: 20px; }
    .profile-avatar-big { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; margin-bottom: 15px; cursor: pointer; background: #242f3d; }
    .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
    .profile-bio { font-size: 14px; color: #ccc; text-align: center; font-style: italic; margin-bottom: 10px; }
    .profile-phone { font-size: 15px; color: #7d8b99; }
    .profile-settings { padding: 20px; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #242f3d; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-logo">🚀</div>
  <h1>Ультра+</h1>
  
  <div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <button class="auth-tab-btn" id="tab-login" onclick="switchTab('login')" style="color: white;">Вход</button>
    <button class="auth-tab-btn" id="tab-register" onclick="switchTab('register')" style="color: #888;">Регистрация</button>
  </div>

  <div id="form-login" style="display: flex; flex-direction: column; width: 100%; max-width: 300px; gap: 10px;">
    <input id="login-name" class="auth-input" placeholder="Логин или номер" autocomplete="off" />
    <input id="login-pass" class="auth-input" type="password" placeholder="Пароль" />
    <button class="auth-submit" onclick="login()">Войти</button>
  </div>

  <div id="form-register" style="display: none; flex-direction: column; width: 100%; max-width: 300px; gap: 10px;">
    <input id="reg-username" class="auth-input" placeholder="Логин" autocomplete="off" />
    <input id="reg-phone" class="auth-input" placeholder="Номер телефона" type="tel" />
    <input id="reg-pass" class="auth-input" type="password" placeholder="Пароль" />
    <button class="auth-submit" onclick="register()">Создать аккаунт</button>
  </div>

  <div id="status-msg"></div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="main-screen">
  <div class="header">
    <h2>Ультра+</h2>
    <div>
      <button onclick="findUser()">🔍</button>
      <button onclick="showProfile()">⚙️</button>
    </div>
  </div>
  <div id="chat-list"></div>
  <button class="fab" onclick="findUser()">+</button>
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">💬</span><span>Чаты</span></div>
    <div class="nav-item"><span class="nav-icon">📞</span><span>Звонки</span></div>
    <div class="nav-item"><span class="nav-icon">👥</span><span>Контакты</span></div>
    <div class="nav-item" onclick="showProfile()"><span class="nav-icon">👤</span><span>Профиль</span></div>
  </div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-avatar" id="chat-head-avatar" style="width: 40px; height: 40px; margin-right: 10px;"></div>
    <div>
      <h2 id="chat-title" style="font-size:16px;">Чат</h2>
      <span id="chat-status" style="font-size:12px;">в сети</span>
    </div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input type="file" id="file-input" style="display: none;">
    <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
    <button class="icon-btn" onclick="toggleRecording()" id="mic-btn">🎤</button>
    <input id="msg-input" placeholder="Написать сообщение...">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- ЭКРАН ПРОФИЛЯ -->
<div id="profile-screen">
  <div class="profile-top">
    <button class="back-btn" onclick="closeProfile()">←</button>
    <div class="profile-avatar-big" onclick="document.getElementById('avatar-upload').click()">
      <img id="prof-avatar-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    </div>
    <input type="file" id="avatar-upload" style="display: none;" accept="image/*">
    <h2 id="prof-name" class="profile-name">@...</h2>
    <div id="prof-bio" class="profile-bio">Напишите что-нибудь о себе...</div>
    <div id="prof-phone" class="profile-phone">+...</div>
  </div>
  <div class="profile-settings">
    <div class="setting-item" onclick="editBio()"><span>📝 Изменить статус</span></div>
    <div class="setting-item" onclick="document.getElementById('avatar-upload').click()"><span>📷 Выбрать фото</span></div>
    <div class="setting-item" onclick="toggleHidePhone()"><span>🔒 Скрыть номер</span><span id="hide-phone-status" style="color: #3390ec;">Выкл</span></div>
    <div class="setting-item" onclick="logout()"><span style="color: #ff4444;">🚪 Выйти</span></div>
  </div>
</div>

<script>
let currentUser = "", currentPhone = "", currentAvatar = "", currentHidePhone = false;
let currentChatId = "", currentChatName = "", messageInterval, statusInterval;
let selectedFile = null, selectedFileType = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let recordingTimer, recordingSeconds = 0;

window.onload = () => {
  const savedUser = localStorage.getItem('ultra_user');
  if(savedUser) {
    currentUser = savedUser;
    currentPhone = localStorage.getItem('ultra_phone') || '';
    currentAvatar = localStorage.getItem('ultra_avatar') || '';
    currentHidePhone = localStorage.getItem('ultra_hide') === 'true';
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    loadChats();
    setInterval(() => sendPulse(false), 10000);
  }
  
  // Привязка кнопок
  document.getElementById('file-input').addEventListener('change', handleFileSelect);
  document.getElementById('msg-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
  document.getElementById('msg-input').addEventListener('input', () => sendPulse(true));
  document.getElementById('avatar-upload').addEventListener('change', uploadAvatar);
};

function switchTab(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'flex' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'flex' : 'none';
  document.getElementById('tab-login').style.color = tab === 'login' ? 'white' : '#888';
  document.getElementById('tab-register').style.color = tab === 'register' ? 'white' : '#888';
}

async function register() {
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-pass').value;
  const statusEl = document.getElementById('status-msg');
  if(!username || !phone || !password) { statusEl.innerText = "Заполните все поля!"; return; }
  
  statusEl.innerText = "Отправка...";
  try {
    const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, phone, password }) });
    const data = await res.json();
    if(data.success) {
      statusEl.innerText = "УСПЕХ! Аккаунт создан.";
      switchTab('login');
    } else { statusEl.innerText = "ОШИБКА: " + data.error; }
  } catch (e) { statusEl.innerText = "ОШИБКА СЕТИ: " + e.message; }
}

async function login() {
  const loginVal = document.getElementById('login-name').value.trim().replace('@', '');
  const password = document.getElementById('login-pass').value;
  const statusEl = document.getElementById('status-msg');
  if(!loginVal || !password) { statusEl.innerText = "Заполните все поля!"; return; }
  
  statusEl.innerText = "Вход...";
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ login: loginVal, password }) });
    const data = await res.json();
    if(data.success) {
      statusEl.innerText = "УСПЕХ! Вход выполнен.";
      currentUser = data.user.username; currentPhone = data.user.phone; currentAvatar = data.user.avatar;
      localStorage.setItem('ultra_user', currentUser);
      localStorage.setItem('ultra_phone', currentPhone);
      localStorage.setItem('ultra_avatar', currentAvatar || '');
      
      setTimeout(() => {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
        loadChats();
        setInterval(() => sendPulse(false), 10000);
      }, 1000);
      
    } else { statusEl.innerText = "ОШИБКА: " + data.error; }
  } catch (e) { statusEl.innerText = "ОШИБКА СЕТИ: " + e.message; }
}

function logout() { if(confirm("Выйти?")) { localStorage.clear(); location.reload(); } }
function sendPulse(typing) { if(currentUser) fetch('/api/pulse', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, typing }) }); }

async function showProfile() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('profile-screen').style.display = 'flex';
  document.getElementById('prof-name').innerText = '@' + currentUser;
  document.getElementById('prof-phone').innerText = currentHidePhone ? 'Номер скрыт' : currentPhone;
  document.getElementById('hide-phone-status').innerText = currentHidePhone ? 'Вкл' : 'Выкл';
  if(currentAvatar) document.getElementById('prof-avatar-img').src = currentAvatar;
  const res = await fetch('/api/user/' + currentUser);
  const data = await res.json();
  document.getElementById('prof-bio').innerText = (data && data.bio) ? data.bio : 'Напишите что-нибудь о себе...';
}

async function editBio() {
  const newBio = prompt("Ваш новый статус:");
  if(newBio === null) return;
  await fetch('/api/updateProfile', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, bio: newBio }) });
  document.getElementById('prof-bio').innerText = newBio || 'Напишите что-нибудь о себе...';
}

function closeProfile() { document.getElementById('profile-screen').style.display = 'none'; document.getElementById('main-screen').style.display = 'flex'; }

function toggleHidePhone() {
  currentHidePhone = !currentHidePhone;
  localStorage.setItem('ultra_hide', currentHidePhone);
  document.getElementById('hide-phone-status').innerText = currentHidePhone ? 'Вкл' : 'Выкл';
  document.getElementById('prof-phone').innerText = currentHidePhone ? 'Номер скрыт' : currentPhone;
  fetch('/api/updateProfile', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, hidePhone: currentHidePhone }) });
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result;
    const res = await fetch('/api/upload', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ fileName: 'avatar.jpg', fileData: base64, fileType: file.type }) });
    const data = await res.json();
    if(data.success) {
      currentAvatar = data.url;
      localStorage.setItem('ultra_avatar', currentAvatar);
      document.getElementById('prof-avatar-img').src = currentAvatar;
      await fetch('/api/updateProfile', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, avatar: currentAvatar }) });
    }
  };
  reader.readAsDataURL(file);
}

async function loadChats() {
  const res = await fetch('/api/chats/' + currentUser);
  const chats = await res.json();
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  
  if(chats.length === 0) {
    list.innerHTML = `<div style="text-align:center; margin-top: 40px;"><h3 style="color: #fff;">Здесь пока пусто</h3><button onclick="findUser()" style="background: #3390ec; color: white; border: none; padding: 12px 24px; border-radius: 12px; margin-top: 15px; cursor:pointer;">Найти друга</button></div>`;
    return;
  }

  chats.sort((a, b) => (b.lastTime || 0) - (a.lastTime || 0));

  chats.forEach(chat => {
    const div = document.createElement('div'); div.className = 'chat-item'; div.onclick = () => openChat(chat.id, chat.name, chat.isGroup);
    let timeStr = chat.lastTime ? new Date(chat.lastTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
    let lastMsgText = chat.lastMessage || 'Нет сообщений';
    if (chat.lastSender === currentUser) lastMsgText = 'Вы: ' + lastMsgText;
    let unreadBadge = chat.unreadCount > 0 ? `<div class="unread-badge">${chat.unreadCount}</div>` : '';
    
    div.innerHTML = `
      <div class="chat-avatar"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></div>
      <div class="chat-info">
        <div class="chat-name">@${chat.name}</div>
        <div class="chat-preview">${lastMsgText}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${timeStr}</div>
        ${unreadBadge}
      </div>
    `;
    list.appendChild(div);
  });
}

async function findUser() {
  const choice = prompt("1 - по номеру, 2 - по @логину:");
  if(!choice) return;
  let query = prompt(choice === '1' ? "Номер друга:" : "Логин друга:");
  if(!query) return;
  const url = choice === '1' ? '/api/find-by-phone/' + encodeURIComponent(query) : '/api/user/' + encodeURIComponent(query);
  const res = await fetch(url);
  const data = await res.json();
  if(!data) return alert("Не найден.");
  if(data.username === currentUser) return alert("Это вы!");
  const chatId = [currentUser, data.username].sort().join('_');
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, chatId, name: data.username, isGroup: false }) });
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, bod
