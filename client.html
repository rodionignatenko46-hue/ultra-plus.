<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ультра+</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #2a2a4a; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #888; font-weight: bold; }
    .auth-tab.active { color: #00d4ff; border-bottom: 2px solid #00d4ff; }
    .auth-form { display: none; flex-direction: column; }
    .auth-form.active { display: flex; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-logo">🚀</div>
  <h1>Ультра+</h1>
  
  <div class="auth-tabs">
    <div class="auth-tab active" id="tab-login">Вход</div>
    <div class="auth-tab" id="tab-register">Регистрация</div>
  </div>

  <div id="form-login" class="auth-form active">
    <div class="input-group">
      <label>Логин или номер</label>
      <input id="login-name" placeholder="@lorion4ik или +7999" autocomplete="off" />
    </div>
    <div class="input-group">
      <label>Пароль</label>
      <input id="login-pass" type="password" placeholder="Ваш пароль" />
    </div>
    <button id="btn-login">Войти</button>
  </div>

  <div id="form-register" class="auth-form">
    <div class="input-group">
      <label>Придумайте @логин</label>
      <input id="reg-username" placeholder="lorion4ik" autocomplete="off" />
    </div>
    <div class="input-group">
      <label>Номер телефона</label>
      <input id="reg-phone" placeholder="+7 (999) 000-00-00" type="tel" />
    </div>
    <div class="input-group">
      <label>Придумайте пароль</label>
      <input id="reg-pass" type="password" placeholder="Минимум 4 символа" />
    </div>
    <button id="btn-register">Создать аккаунт</button>
  </div>
</div>

<div id="main-screen" style="display:none;">
  <div class="header">
    <h2>Ультра+</h2>
  </div>
  <div id="chat-list"></div>
</div>

<script>
// ПРИВЯЗЫВАЕМ КНОПКИ ЧЕРЕЗ JS (переводчик их не сломает)
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
  document.getElementById('tab-register').addEventListener('click', () => switchTab('register'));
  document.getElementById('btn-login').addEventListener('click', login);
  document.getElementById('btn-register').addEventListener('click', register);
});

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  if(tab === 'login') {
    document.getElementById('tab-login').classList.add('active');
    document.getElementById('form-login').classList.add('active');
  } else {
    document.getElementById('tab-register').classList.add('active');
    document.getElementById('form-register').classList.add('active');
  }
}

async function register() {
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const phone = document.getElementById('reg-phone').value.trim();
  const password = document.getElementById('reg-pass').value;
  if(!username || !phone || !password) return alert("Заполните все поля!");
  
  try {
    const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, phone, password }) });
    const data = await res.json();
    
    if(data.success) {
      alert("Аккаунт создан! Теперь войдите.");
      switchTab('login');
    } else {
      alert("ОШИБКА: " + data.error);
    }
  } catch (e) {
    alert("ОШИБКА СЕТИ: " + e.message);
  }
}

async function login() {
  const loginVal = document.getElementById('login-name').value.trim().replace('@', '');
  const password = document.getElementById('login-pass').value;
  if(!loginVal || !password) return alert("Заполните все поля!");

  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ login: loginVal, password }) });
    const data = await res.json();
    
    if(data.success) {
      alert("Успешный вход! Добро пожаловать, @" + data.user.username);
      // Здесь позже будет переход на главный экран
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
    } else {
      alert("Ошибка: " + data.error);
    }
  } catch (e) {
    alert("ОШИБКА СЕТИ: " + e.message);
  }
}
</script>
</body>
</html>
