<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Ультра+</title></head>
<body>
<h3>Ультра+</h3>
<div>Мой ID: <code id="myid">Генерация...</code></div>
<input id="to" placeholder="ID получателя" style="width: 300px;">
<br><br>
<textarea id="text" placeholder="Сообщение" style="width: 300px; height: 80px;"></textarea>
<br><br>
<button id="send">Отправить</button>
<pre id="log" style="background: #eee; padding: 10px; height: 200px; overflow-y: auto;"></pre>

<script>
const enc = new TextEncoder(), dec = new TextDecoder();
const log = (s) => {
  const logEl = document.getElementById('log');
  logEl.textContent += s + '\n';
  logEl.scrollTop = logEl.scrollHeight;
};

let myKeys, myId;
const knownKeys = {};

async function init() {
  try {
    myKeys = await crypto.subtle.generateKey(
      { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
      true, ["encrypt", "decrypt"]
    );
    
    const exported = await crypto.subtle.exportKey("spki", myKeys.publicKey);
    myId = btoa(String.fromCharCode(...new Uint8Array(exported)));
    document.getElementById('myid').textContent = myId;
    log('Ключи сгенерированы. Регистрация на сервере...');

    // Регистрируемся
    await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: myId, pubkey: myId })
    });
    log('Успешно зарегистрирован.');
    
    // Запускаем цикл проверки сообщений
    setInterval(checkMessages, 2000);
  } catch (e) {
    log('Ошибка: ' + e.message);
  }
}

async function checkMessages() {
  try {
    const res = await fetch('/api/messages/' + encodeURIComponent(myId));
    const msgs = await res.json();
    
    for (let m of msgs) {
      if (!knownKeys[m.from]) {
        const keyRes = await fetch('/api/key/' + encodeURIComponent(m.from));
        const keyData = await keyRes.json();
        if (keyData.pubkey) knownKeys[m.from] = keyData.pubkey;
      }
      
      document.getElementById('to').value = m.from;
      const rawPub = Uint8Array.from(atob(m.from), c => c.charCodeAt(0));
      const theirPubKey = await crypto.subtle.importKey("spki", rawPub, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]);
      
      const encryptedAesKey = Uint8Array.from(atob(m.key), c => c.charCodeAt(0));
      const aesKeyRaw = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, myKeys.privateKey, encryptedAesKey);
      
      const aesKey = await crypto.subtle.importKey("raw", aesKeyRaw, { name: "AES-GCM" }, false, ["decrypt"]);
      const nonce = Uint8Array.from(atob(m.nonce), c => c.charCodeAt(0));
      const ct = Uint8Array.from(atob(m.ciphertext), c => c.charCodeAt(0));
      
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, aesKey, ct);
      log(`[${m.from.slice(0,6)}...]: ${dec.decode(pt)}`);
    }
  } catch (e) {
    // Игнорируем ошибки сети, просто ждем следующего раза
  }
}

document.getElementById('send').onclick = async () => {
  const to = document.getElementById('to').value.trim();
  const text = document.getElementById('text').value;
  
  if (!to || !text) { log('Заполните ID получателя и текст.'); return; }

  try {
    if (!knownKeys[to]) {
      log('Запрос ключа у собеседника...');
      const keyRes = await fetch('/api/key/' + encodeURIComponent(to));
      const keyData = await keyRes.json();
      if (!keyData.pubkey) { log('Собеседник не найден в сети.'); return; }
      knownKeys[to] = keyData.pubkey;
    }

    const rawPub = Uint8Array.from(atob(knownKeys[to]), c => c.charCodeAt(0));
    const theirPubKey = await crypto.subtle.importKey("spki", rawPub, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]);

    const aesKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
    const aesKeyRaw = await crypto.subtle.exportKey("raw", aesKey);
    const encryptedAesKey = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, theirPubKey, aesKeyRaw);

    const nonce = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce }, aesKey, enc.encode(text));
    
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to: to, from: myId,
        key: btoa(String.fromCharCode(...new Uint8Array(encryptedAesKey))),
        nonce: btoa(String.fromCharCode(...new Uint8Array(nonce))),
        ciphertext: btoa(String.fromCharCode(...new Uint8Array(ct)))
      })
    });
    
    log(`[Вы]: ${text}`);
    document.getElementById('text').value = ''; 
  } catch (e) {
    log('Ошибка отправки: ' + e.message);
  }
};

init();
</script>
</body>
</html>
