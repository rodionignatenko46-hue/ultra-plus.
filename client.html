<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ультра+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран входа -->
<div id="auth-screen">
  <h1>Ультра+</h1>
  <input id="reg-username" placeholder="Придумайте логин (без @)" />
  <input id="reg-avatar" placeholder="Ссылка на аватарку (необязательно)" />
  <button onclick="register()">Войти</button>
</div>

<!-- Основной экран -->
<div id="main-screen">
  <div class="header">
    <h2 id="my-name">Мой профиль</h2>
    <button onclick="showNewChat()">+ Чат</button>
    <button onclick="showNewGroup()">+ Группа</button>
  </div>
  <div id="chat-list"></div>
</div>

<!-- Экран чата -->
<div id="chat-screen" style="width:100%; max-width:400px; height:100vh; background:#212121; display:none; flex-direction:column;">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-avatar" id="chat-head-avatar" style="width:35px; height:35px; font-size:16px; margin-right:10px;"></div>
    <h2 id="chat-title" style="font-size:16px;">Чат</h2>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
let currentUser = "";
let currentChatId = "";
let currentChatName = "";
let messageInterval;

// 1. Вход
async function register() {
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const avatar = document.getElementById('reg-avatar').value.trim();
  if(!username) return alert("Введите логин!");

  const res = await fetch('/api/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username, avatar, pubkey: "dummy_key" })
  });
  const data = await res.json();
  
  if(data.success) {
    currentUser = username;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    document.getElementById('my-name').innerText = '@' + currentUser;
    loadChats();
  }
}

// 2. Загрузка списка чатов
async function loadChats() {
  const res = await fetch('/api/chats/' + currentUser);
  const chats = await res.json();
  const list = document.getElementById('chat-list');
  list.innerHTML = '';

  if(chats.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">Нет чатов. Нажмите "+ Чат"</p>';
  }

  chats.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(chat.id, chat.name, chat.isGroup);
    
    // Аватарка
    let avatarHtml = chat.isGroup ? '👥' : chat.name[0].toUpperCase();
    div.innerHTML = `
      <div class="chat-avatar">${avatarHtml}</div>
      <div class="chat-info">
        <div class="chat-name">${chat.name}</div>
        <div class="chat-preview">Нажмите, чтобы открыть</div>
      </div>
    `;
    list.appendChild(div);
  });
}

// 3. Создание чата 1 на 1
async function showNewChat() {
  const toUser = prompt("Введите логин собеседника (без @):");
  if(!toUser || toUser === currentUser) return;

  // Проверяем существует ли он
  const res = await fetch('/api/user/' + toUser);
  const userData = await res.json();
  if(!userData) return alert("Пользователь не найден! (Он должен хотя бы раз зайти в приложение)");

  // Создаем общий ID чата (сортируем имена, чтобы у обоих был одинаковый ID)
  const chatId = [currentUser, toUser].sort().join('_');
  
  // Добавляем чат себе
  await fetch('/api/addChat', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: currentUser, chatId, name: toUser, isGroup: false })
  });

  // Добавляем чат собеседнику
  await fetch('/api/addChat', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: toUser, chatId, name: currentUser, isGroup: false })
  });

  loadChats();
}

// 4. Создание группы
async function showNewGroup() {
  const groupName = prompt("Введите название группы:");
  if(!groupName) return;

  const res = await fetch('/api/group', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ groupName, creator: currentUser })
  });
  const data = await res.json();
  loadChats();
}

// 5. Открытие чата
function openChat(id, name, isGroup) {
  currentChatId = id;
  currentChatName = name;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('chat-title').innerText = name;
  document.getElementById('chat-head-avatar').innerHTML = isGroup ? '👥' : name[0].toUpperCase();
  
  loadMessages();
  if(messageInterval) clearInterval(messageInterval);
  messageInterval = setInterval(loadMessages, 2000); // Проверка каждые 2 сек
}

function closeChat() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  clearInterval(messageInterval);
  loadChats();
}

// 6. Загрузка сообщений
async function loadMessages() {
  if(!currentChatId) return;
  const res = await fetch('/api/messages/' + currentChatId);
  const msgs = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';

  msgs.forEach(m => {
    const div = document.createElement('div');
    const isMe = m.from === currentUser;
    div.className = `msg-bubble ${isMe ? 'msg-my' : 'msg-their'}`;
    // В группах показываем имя отправителя
    div.innerHTML = (!isMe && currentChatId.startsWith('group_') ? `<b style="font-size:12px; color:#3390ec; display:block;">@${m.from}</b>` : '') + m.text;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

// 7. Отправка сообщения
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text) return;

  await fetch('/api/message', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ chatId: currentChatId, from: currentUser, text })
  });
  input.value = '';
  loadMessages();
}
</script>
</body>
</html>
