<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ультра+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ВХОД -->
<div id="auth-screen">
  <div class="logo">🚀</div>
  <h2>Ультра+</h2>
  <input id="u" placeholder="Логин" />
  <input id="p" type="password" placeholder="Пароль" />
  <input id="ph" placeholder="Номер (для рег.)" />
  <button id="btn-reg">Зарегистрироваться</button>
  <button id="btn-log">Войти</button>
  <div id="msg"></div>
</div>

<!-- ЧАТЫ -->
<div id="main-screen">
  <div class="header">
    <h2>Ультра+</h2>
    <button id="btn-profile">👤</button>
    <button id="btn-find">🔍</button>
  </div>
  <div id="chat-list"></div>
</div>

<!-- ПЕРЕПИСКА -->
<div id="chat-screen">
  <div class="chat-header">
    <button id="btn-back">←</button>
    <!-- ВОТ ЗДЕСЬ АВАТАРКА В ШАПКЕ ЧАТА -->
    <img id="chat-head-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover;">
    <h2 id="chat-title">@...</h2>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input type="file" id="file-input" style="display: none;">
    <button id="btn-attach" class="icon-btn">📎</button>
    <button id="btn-mic" class="icon-btn">🎤</button>
    <input id="msg-input" placeholder="Сообщение..." />
    <button id="btn-send">➤</button>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile-screen">
  <div class="profile-top">
    <button id="btn-back-profile">←</button>
    <div class="profile-avatar-big" id="btn-avatar-upload">
      <img id="prof-avatar-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    </div>
    <input type="file" id="avatar-upload" style="display: none;" accept="image/*">
    <h2 id="prof-name">@...</h2>
    <div id="prof-bio">Напишите что-нибудь о себе...</div>
  </div>
  <div class="profile-settings">
    <div id="btn-edit-bio">📝 Изменить статус</div>
    <div id="btn-change-photo">📷 Выбрать фото</div>
    <div id="btn-logout" style="color: #ff4444;">🚪 Выйти</div>
  </div>
</div>

<script src="app.js"></script>
</body>
    </html>
