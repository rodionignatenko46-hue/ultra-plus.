<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen" style="display: flex; flex-direction: column; padding: 20px; height: 100vh; justify-content: center; align-items: center;">
    <h2>Тест регистрации</h2>
    
    <div id="form-register" style="display: flex; flex-direction: column; width: 100%; max-width: 300px; gap: 10px;">
      <input id="reg-username" placeholder="Логин" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; color: #000;" />
      <input id="reg-phone" placeholder="Номер" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; color: #000;" />
      <input id="reg-pass" type="password" placeholder="Пароль" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; color: #000;" />
      <button onclick="registerTest()" style="padding: 10px; background: blue; color: white; border: none; border-radius: 5px; cursor: pointer;">Зарегистрироваться</button>
    </div>

    <div id="status" style="margin-top: 20px; color: yellow; font-weight: bold;"></div>
  </div>

  <script>
    async function registerTest() {
      const username = document.getElementById('reg-username').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-pass').value;
      const statusEl = document.getElementById('status');
      
      if(!username || !phone || !password) {
        statusEl.innerText = "Заполните все поля!";
        return;
      }
      
      statusEl.innerText = "Отправка...";
      
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username, phone, password })
        });
        const data = await res.json();
        
        if(data.success) {
          statusEl.innerText = "УСПЕХ! Аккаунт создан. Идите в базу Supabase проверять.";
        } else {
          statusEl.innerText = "ОШИБКА СЕРВЕРА: " + data.error;
        }
      } catch (e) {
        statusEl.innerText = "ОШИБКА СЕТИ: " + e.message;
      }
    }
  </script>
</body>
</html>
