<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ультра+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран входа -->
<div id="auth-screen">
  <h1>Ультра+</h1>
  <input id="reg-username" placeholder="Придумайте логин (без @)" />
  <input id="reg-avatar" placeholder="Ссылка на аватарку (необязательно)" />
  <button onclick="register()">Войти</button>
</div>

<!-- Основной экран -->
<div id="main-screen">
  <div class="header">
    <h2 id="my-name">Мой профиль</h2>
    <div>
      <button onclick="showNewGroup()">+ Группа</button>
      <button onclick="showNewChat()">+ Чат</button>
      <button class="profile-btn" onclick="showProfile()">👤</button>
    </div>
  </div>
  <div id="chat-list"></div>
</div>

<!-- Экран чата -->
<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-avatar" id="chat-head-avatar"></div>
    <h2 id="chat-title">Чат</h2>
  </div>
  <div id="messages"></div>
  
  <div class="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(this)">
    <button onclick="document.getElementById('file-input').click()">📎</button>
    <button onclick="recordVoice()" id="mic-btn" style="background: none; color: #3390ec;">🎤</button>
    <input id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- Экран профиля -->
<div id="profile-screen">
  <div class="profile-header">
    <button class="back-btn" onclick="closeProfile()">←</button>
    <h2>Мой профиль</h2>
  </div>
  <div class="profile-info">
    <div class="profile-avatar" id="prof-avatar"></div>
    <div class="profile-name" id="prof-name"></div>
  </div>
  <input id="prof-new-avatar" class="profile-input" placeholder="Новая ссылка на аватарку">
  <button class="profile-save-btn" onclick="saveProfile()">Сохранить</button>
</div>

<script>
let currentUser = "", currentChatId = "", currentChatName = "", messageInterval;
let selectedFile = null, selectedFileType = null;
let mediaRecorder, audioChunks = [];

window.onload = () => {
  const savedUser = localStorage.getItem('ultra_user');
  if(savedUser) {
    currentUser = savedUser;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    document.getElementById('my-name').innerText = '@' + currentUser;
    loadChats();
  }
};

async function register() {
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const avatar = document.getElementById('reg-avatar').value.trim();
  if(!username) return alert("Введите логин!");
  const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, avatar }) });
  if((await res.json()).success) {
    currentUser = username;
    localStorage.setItem('ultra_user', currentUser);
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    document.getElementById('my-name').innerText = '@' + currentUser;
    loadChats();
  }
}

async function loadChats() {
  const res = await fetch('/api/chats/' + currentUser);
  const chats = await res.json();
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  if(chats.length === 0) list.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">Нет чатов.</p>';
  chats.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(chat.id, chat.name, chat.isGroup);
    div.innerHTML = `<div class="chat-avatar">${chat.isGroup ? '👥' : chat.name[0].toUpperCase()}</div><div class="chat-info"><div class="chat-name">${chat.name}</div></div>`;
    list.appendChild(div);
  });
}

async function showNewChat() {
  const toUser = prompt("Введите логин собеседника:");
  if(!toUser || toUser === currentUser) return;
  if(!(await (await fetch('/api/user/' + toUser)).json())) return alert("Пользователь не найден!");
  const chatId = [currentUser, toUser].sort().join('_');
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, chatId, name: toUser }) });
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: toUser, chatId, name: currentUser }) });
  loadChats();
}

async function showNewGroup() {
  const groupName = prompt("Название группы:");
  if(!groupName) return;
  await fetch('/api/group', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ groupName, creator: currentUser }) });
  loadChats();
}

function openChat(id, name, isGroup) {
  currentChatId = id;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('chat-title').innerText = name;
  document.getElementById('chat-head-avatar').innerHTML = isGroup ? '👥' : name[0].toUpperCase();
  loadMessages();
  if(messageInterval) clearInterval(messageInterval);
  messageInterval = setInterval(loadMessages, 1000);
}

function closeChat() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  clearInterval(messageInterval);
  loadChats();
}

function showProfile() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('profile-screen').style.display = 'flex';
  document.getElementById('prof-name').innerText = '@' + currentUser;
  document.getElementById('prof-avatar').innerHTML = currentUser[0].toUpperCase();
}
function closeProfile() {
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
}
async function saveProfile() {
  const newAv = document.getElementById('prof-new-avatar').value.trim();
  if(!newAv) return;
  await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, avatar: newAv }) });
  alert("Аватарка обновлена!");
  closeProfile();
}

function handleFileSelect(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    selectedFile = e.target.result;
    selectedFileType = file.type;
    document.getElementById('msg-input').placeholder = "Файл прикреплен!";
  };
  reader.readAsDataURL(file);
}

// Запись голосового сообщения
async function recordVoice() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = async function(e) {
        selectedFile = e.target.result;
        selectedFileType = 'audio/webm';
        alert("Голосовое записано! Нажмите ➤ чтобы отправить.");
      };
      reader.readAsDataURL(audioBlob);
    };
    mediaRecorder.start();
    document.getElementById('mic-btn').style.color = 'red'; // Индикатор записи
    setTimeout(() => {
      if(mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        document.getElementById('mic-btn').style.color = '#3390ec';
        stream.getTracks().forEach(track => track.stop());
      }
    }, 5000); // Запись 5 секунд (для теста)
  } catch(e) { alert("Нет доступа к микрофону"); }
}

async function loadMessages() {
  if(!currentChatId) return;
  try {
    const res = await fetch(`/api/messages/${currentChatId}?reader=${currentUser}`);
    const msgs = await res.json();
    const box = document.getElementById('messages');
    if(box.children.length === msgs.length && box.dataset.lastMsg === (msgs[msgs.length-1]?.id || '')) return;
    
    box.innerHTML = '';
    box.dataset.lastMsg = msgs[msgs.length-1]?.id || '';

    msgs.forEach(m => {
      const isMe = m.from === currentUser;
      const div = document.createElement('div');
      div.className = `msg-bubble ${isMe ? 'msg-my' : 'msg-their'}`;
      const time = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      let readStatus = isMe ? (m.readBy.length > 1 ? ' ✓✓' : ' ✓') : '';

      let content = '';
      if(m.fileData) {
        if(m.fileType.startsWith('image/')) content += `<img src="${m.fileData}" style="max-width:100%; border-radius:10px; margin-bottom:5px;"><br>`;
        else if(m.fileType.startsWith('video/')) content += `<video src="${m.fileData}" controls style="max-width:100%; border-radius:10px; margin-bottom:5px;"></video><br>`;
        else if(m.fileType.startsWith('audio/')) content += `<audio src="${m.fileData}" controls></audio><br>`;
        else content += `<a href="${m.fileData}" download="file" style="color:#fff;">📄 Скачать файл</a><br>`;
      }
      content += m.text;

      div.innerHTML = `
        ${(!isMe && currentChatId.startsWith('group_') ? `<b style="font-size:12px; color:#3390ec; display:block;">@${m.from}</b>` : '')}
        <div>${content}</div>
        <div style="font-size:10px; text-align:right; opacity:0.7; margin-top:5px;">${time}${readStatus}</div>
      `;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch(e) {}
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text && !selectedFile) return;
  input.value = '';
  const tempFile = selectedFile;
  const tempType = selectedFileType;
  selectedFile = null;
  selectedFileType = null;
  input.placeholder = "Написать сообщение...";
  await fetch('/api/message', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ chatId: currentChatId, from: currentUser, text, fileData: tempFile, fileType: tempType }) });
  loadMessages();
}
</script>
</body>
</html>
