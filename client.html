<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ультра+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран входа -->
<div id="auth-screen">
  <h1>Ультра+</h1>
  <input id="reg-username" placeholder="Придумайте логин (без @)" />
  <input id="reg-avatar" placeholder="Ссылка на аватарку (необязательно)" />
  <button onclick="register()">Войти</button>
</div>

<!-- Основной экран -->
<div id="main-screen">
  <div class="header">
    <h2 id="my-name">Мой профиль</h2>
    <button onclick="showNewChat()">+ Чат</button>
    <button onclick="showNewGroup()">+ Группа</button>
  </div>
  <div id="chat-list"></div>
</div>

<!-- Экран чата -->
<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-avatar" id="chat-head-avatar"></div>
    <h2 id="chat-title">Чат</h2>
  </div>
  <div id="messages"></div>
  
  <div class="input-area">
    <!-- Скрытый input для файлов -->
    <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(this)">
    <button onclick="document.getElementById('file-input').click()" style="background: none; color: #3390ec; font-size: 24px;">📎</button>
    <input id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
let currentUser = "", currentChatId = "", currentChatName = "", messageInterval;
let selectedFile = null, selectedFileType = null;

async function register() {
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const avatar = document.getElementById('reg-avatar').value.trim();
  if(!username) return alert("Введите логин!");
  const res = await fetch('/api/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username, avatar, pubkey: "dummy" })
  });
  const data = await res.json();
  if(data.success) {
    currentUser = username;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    document.getElementById('my-name').innerText = '@' + currentUser;
    loadChats();
  }
}

async function loadChats() {
  const res = await fetch('/api/chats/' + currentUser);
  const chats = await res.json();
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  if(chats.length === 0) list.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">Нет чатов. Нажмите "+ Чат"</p>';
  chats.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.onclick = () => openChat(chat.id, chat.name, chat.isGroup);
    div.innerHTML = `
      <div class="chat-avatar">${chat.isGroup ? '👥' : chat.name[0].toUpperCase()}</div>
      <div class="chat-info"><div class="chat-name">${chat.name}</div></div>`;
    list.appendChild(div);
  });
}

async function showNewChat() {
  const toUser = prompt("Введите логин собеседника (без @):");
  if(!toUser || toUser === currentUser) return;
  const res = await fetch('/api/user/' + toUser);
  if(!(await res.json())) return alert("Пользователь не найден!");
  const chatId = [currentUser, toUser].sort().join('_');
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, chatId, name: toUser, isGroup: false }) });
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: toUser, chatId, name: currentUser, isGroup: false }) });
  loadChats();
}

async function showNewGroup() {
  const groupName = prompt("Введите название группы:");
  if(!groupName) return;
  await fetch('/api/group', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ groupName, creator: currentUser }) });
  loadChats();
}

function openChat(id, name, isGroup) {
  currentChatId = id;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('chat-title').innerText = name;
  document.getElementById('chat-head-avatar').innerHTML = isGroup ? '👥' : name[0].toUpperCase();
  loadMessages();
  if(messageInterval) clearInterval(messageInterval);
  messageInterval = setInterval(loadMessages, 2000);
}

function closeChat() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  clearInterval(messageInterval);
  loadChats();
}

// Обработка выбора файла
function handleFileSelect(input) {
  const file = input.files[0];
  if(!file) return;
  if(file.size > 10 * 1024 * 1024) return alert("Файл слишком большой (макс 10МБ)");
  
  const reader = new FileReader();
  reader.onload = function(e) {
    selectedFile = e.target.result; // base64
    selectedFileType = file.type;
    alert("Файл прикреплен! Нажмите Отправить.");
  };
  reader.readAsDataURL(file);
}

async function loadMessages() {
  if(!currentChatId) return;
  // Передаем ?reader=логин, чтобы сервер отметил прочитанным
  const res = await fetch(`/api/messages/${currentChatId}?reader=${currentUser}`);
  const msgs = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';

  msgs.forEach(m => {
    const isMe = m.from === currentUser;
    const div = document.createElement('div');
    div.className = `msg-bubble ${isMe ? 'msg-my' : 'msg-their'}`;
    
    // Время
    const time = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    
    // Галочки прочтения (только для своих сообщений)
    let readStatus = '';
    if(isMe) {
      // Если в чате больше 1 человека (группа) или собеседник прочитал
      readStatus = m.readBy.length > 1 ? ' ✓✓' : ' ✓';
    }

    let content = '';
    if(m.fileData) {
      if(m.fileType.startsWith('image/')) content += `<img src="${m.fileData}" style="max-width:100%; border-radius:10px; margin-bottom:5px;"><br>`;
      else if(m.fileType.startsWith('video/')) content += `<video src="${m.fileData}" controls style="max-width:100%; border-radius:10px; margin-bottom:5px;"></video><br>`;
      else content += `<a href="${m.fileData}" download="file" style="color:#fff;">📄 Скачать файл</a><br>`;
    }
    content += m.text;

    div.innerHTML = `
      ${(!isMe && currentChatId.startsWith('group_') ? `<b style="font-size:12px; color:#3390ec; display:block;">@${m.from}</b>` : '')}
      <div>${content}</div>
      <div style="font-size:10px; text-align:right; opacity:0.7; margin-top:5px;">${time}${readStatus}</div>
    `;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text && !selectedFile) return;

  await fetch('/api/message', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ chatId: currentChatId, from: currentUser, text, fileData: selectedFile, fileType: selectedFileType })
  });
  input.value = '';
  selectedFile = null;
  selectedFileType = null;
  loadMessages();
}
</script>
</body>
</html>
