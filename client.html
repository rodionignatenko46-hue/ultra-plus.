<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ультра+</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-screen">
  <h1>Ультра+</h1>
  <input id="reg-username" placeholder="Придумайте @логин" />
  <input id="reg-phone" placeholder="Номер телефона" type="tel" />
  <button onclick="register()">Войти</button>
</div>

<div id="main-screen">
  <div class="header">
    <h2>Ультра+</h2>
    <div class="header-icons">
      <button onclick="findByPhone()">🔍</button>
      <button onclick="showProfile()">⚙️</button>
    </div>
  </div>
  <div id="chat-list"></div>
  <button class="fab" onclick="findByPhone()">+</button>
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">💬</span><span>Чаты</span></div>
    <div class="nav-item"><span class="nav-icon">📞</span><span>Звонки</span></div>
    <div class="nav-item"><span class="nav-icon">👥</span><span>Контакты</span></div>
    <div class="nav-item" onclick="showProfile()"><span class="nav-icon">👤</span><span>Профиль</span></div>
  </div>
</div>

<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div class="chat-avatar" id="chat-head-avatar"></div>
    <div>
      <h2 id="chat-title" style="font-size:16px;">Чат</h2>
      <span id="chat-status" style="font-size:12px; color: #00ff88;">в сети</span>
    </div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(this)">
    <button onclick="document.getElementById('file-input').click()" style="background: none; color: #3390ec; box-shadow: none; font-size: 22px;">📎</button>
    <input id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<div id="profile-screen">
  <div class="profile-top">
    <button class="back-btn" onclick="closeProfile()" style="color: #fff; font-size: 24px;">←</button>
    <div class="profile-avatar-big" onclick="document.getElementById('avatar-upload').click()">
      <img id="prof-avatar-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
      <div class="avatar-edit-icon">📷</div>
    </div>
    <input type="file" id="avatar-upload" style="display: none;" accept="image/*" onchange="uploadAvatar(event)">
    <h2 id="prof-name" class="profile-name">@...</h2>
    <div id="prof-phone" class="profile-phone">+...</div>
  </div>
  <div class="profile-settings">
    <div class="setting-item" onclick="document.getElementById('avatar-upload').click()"><span>📷 Выбрать фото</span></div>
    <div class="setting-item" onclick="toggleHidePhone()"><span>🔒 Скрыть номер</span><span id="hide-phone-status" style="color: #3390ec;">Выкл</span></div>
  </div>
</div>

<script>
let currentUser = "", currentPhone = "", currentAvatar = "", currentHidePhone = false;
let currentChatId = "", messageInterval;
let selectedFile = null, selectedFileType = null;

window.onload = () => {
  const savedUser = localStorage.getItem('ultra_user');
  if(savedUser) {
    currentUser = savedUser;
    currentPhone = localStorage.getItem('ultra_phone') || '';
    currentAvatar = localStorage.getItem('ultra_avatar') || '';
    currentHidePhone = localStorage.getItem('ultra_hide') === 'true';
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'flex';
    loadChats();
  }
};

async function register() {
  const username = document.getElementById('reg-username').value.trim().replace('@', '');
  const phone = document.getElementById('reg-phone').value.trim();
  if(!username || !phone) return alert("Введите логин и номер!");
  currentUser = username; currentPhone = phone;
  localStorage.setItem('ultra_user', currentUser);
  localStorage.setItem('ultra_phone', currentPhone);
  await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, phone }) });
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  loadChats();
}

function showProfile() {
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('profile-screen').style.display = 'flex';
  document.getElementById('prof-name').innerText = '@' + currentUser;
  document.getElementById('prof-phone').innerText = currentHidePhone ? 'Номер скрыт' : currentPhone;
  document.getElementById('hide-phone-status').innerText = currentHidePhone ? 'Вкл' : 'Выкл';
  if(currentAvatar) document.getElementById('prof-avatar-img').src = currentAvatar;
}

function closeProfile() {
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
}

function toggleHidePhone() {
  currentHidePhone = !currentHidePhone;
  localStorage.setItem('ultra_hide', currentHidePhone);
  document.getElementById('hide-phone-status').innerText = currentHidePhone ? 'Вкл' : 'Выкл';
  document.getElementById('prof-phone').innerText = currentHidePhone ? 'Номер скрыт' : currentPhone;
  fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, hidePhone: currentHidePhone }) });
}

async function uploadAvatar(event) {
  const file = event.target.files[0];
  if(!file) return;
  
  // Отправляем аватарку в облако
  const reader = new FileReader();
  reader.onload = async function(e) {
    const base64 = e.target.result;
    const res = await fetch('/api/upload', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ fileName: 'avatar.jpg', fileData: base64, fileType: file.type }) });
    const data = await res.json();
    if(data.success) {
      currentAvatar = data.url;
      localStorage.setItem('ultra_avatar', currentAvatar);
      document.getElementById('prof-avatar-img').src = currentAvatar;
      await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, avatar: currentAvatar }) });
    } else { alert('Ошибка загрузки: ' + data.error); }
  };
  reader.readAsDataURL(file);
}

async function loadChats() {
  const res = await fetch('/api/chats/' + currentUser);
  const chats = await res.json();
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  if(chats.length === 0) {
    list.innerHTML = `<div style="text-align:center; margin-top: 40px; padding: 20px;"><h3 style="color: #fff;">Здесь пока пусто</h3><button onclick="findByPhone()" style="background: #3390ec; color: white; border: none; padding: 12px 24px; border-radius: 12px; margin-top: 15px;">Найти друга</button></div>`;
  }
  chats.forEach(chat => {
    const div = document.createElement('div'); div.className = 'chat-item'; div.onclick = () => openChat(chat.id, chat.name, chat.isGroup);
    div.innerHTML = `<div class="chat-avatar"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></div><div class="chat-info"><div class="chat-name">@${chat.name}</div><div class="chat-preview">Нажмите, чтобы открыть</div></div>`;
    list.appendChild(div);
  });
}

async function findByPhone() {
  const phone = prompt("Введите номер телефона друга:");
  if(!phone) return;
  const res = await fetch('/api/find-by-phone/' + encodeURIComponent(phone));
  const data = await res.json();
  if(!data) return alert("Пользователь не найден.");
  if(data.username === currentUser) return alert("Это ваш номер!");
  const chatId = [currentUser, data.username].sort().join('_');
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, chatId, name: data.username, isGroup: false }) });
  await fetch('/api/addChat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: data.username, chatId, name: currentUser, isGroup: false }) });
  loadChats();
}

function openChat(id, name, isGroup) {
  currentChatId = id;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('chat-title').innerText = '@' + name;
  loadMessages();
  if(messageInterval) clearInterval(messageInterval);
  messageInterval = setInterval(loadMessages, 1000);
}

function closeChat() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  clearInterval(messageInterval);
  loadChats();
}

function handleFileSelect(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    selectedFile = e.target.result;
    selectedFileType = file.type;
    document.getElementById('msg-input').placeholder = "Файл готов к отправке!";
  };
  reader.readAsDataURL(file);
}

async function loadMessages() {
  if(!currentChatId) return;
  try {
    const res = await fetch(`/api/messages/${currentChatId}?reader=${currentUser}`);
    const msgs = await res.json();
    const box = document.getElementById('messages');
    if(box.children.length === msgs.length && box.dataset.lastMsg === (msgs[msgs.length-1]?.id || '')) return;
    box.innerHTML = ''; box.dataset.lastMsg = msgs[msgs.length-1]?.id || '';

    msgs.forEach(m => {
      const isMe = m.from === currentUser;
      const div = document.createElement('div');
      div.className = `msg-bubble ${isMe ? 'msg-my' : 'msg-their'}`;
      const time = new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      let readStatus = isMe ? (m.readBy.length > 1 ? ' ✓✓' : ' ✓') : '';
      let content = '';
      if(m.fileUrl) {
        if(m.fileType.startsWith('image/')) content += `<img src="${m.fileUrl}" style="max-width:100%; border-radius:10px; margin-bottom:5px;"><br>`;
        else if(m.fileType.startsWith('video/')) content += `<video src="${m.fileUrl}" controls style="max-width:100%; border-radius:10px; margin-bottom:5px;"></video><br>`;
        else content += `<a href="${m.fileUrl}" target="_blank" style="color:#fff;">📄 Скачать файл</a><br>`;
      }
      content += m.text;
      div.innerHTML = `<div>${content}</div><div style="font-size:10px; text-align:right; opacity:0.7; margin-top:5px;">${time}${readStatus}</div>`;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch(e) {}
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if(!text && !selectedFile) return;

  let fileUrl = null, fileTypeToSend = null;

  // Если прикреплен файл, сначала грузим в облако
  if(selectedFile) {
    input.placeholder = "Загрузка файла...";
    const res = await fetch('/api/upload', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ fileName: 'file.jpg', fileData: selectedFile, fileType: selectedFileType }) });
    const data = await res.json();
    if(data.success) {
      fileUrl = data.url;
      fileTypeToSend = selectedFileType;
    } else {
      alert('Ошибка загрузки файла: ' + data.error);
      input.placeholder = "Написать сообщение...";
      return;
    }
  }

  input.value = ''; selectedFile = null; selectedFileType = null; input.placeholder = "Написать сообщение...";
  
  await fetch('/api/message', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ chatId: currentChatId, from: currentUser, text, fileUrl, fileType: fileTypeToSend }) });
  loadMessages();
}
</script>
</body>
</html>
